name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - if: runner.os != 'Windows'
        run: npm test
      # App/account tests use POSIX shell fixtures; exercise the process and
      # Skill installation regressions on actual Windows runners separately.
      - if: runner.os == 'Windows'
        run: node --test test/exec.test.mjs test/skills-command.test.mjs
